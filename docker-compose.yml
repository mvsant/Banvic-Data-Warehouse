services:
  postgres:
    image: postgres:16.3-alpine3.20
    container_name: banvic-data-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - banvic_network

  meltano:
    image: meltano/meltano:latest-slim
    container_name: banvic-data-meltano
    volumes:
      - ./banvic-data-meltano:/project
      - meltano_plugins:/project/.meltano/plugins/
    working_dir: /project
    tty: true
    entrypoint: ""
    environment:
      MELTANO_DATABASE_URI: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@banvic-data-postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      TARGET_POSTGRES_HOST: banvic-data-postgres
      TARGET_POSTGRES_PORT: ${POSTGRES_PORT}
      TARGET_POSTGRES_USER: ${POSTGRES_USER}
      TARGET_POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      TARGET_POSTGRES_DBNAME: ${POSTGRES_DB}
    depends_on:
      - postgres
    networks:
      - banvic_network
    command: ["tail", "-f", "/dev/null"]

volumes:
  pgdata:
  meltano_plugins:

networks:
  banvic_network:
    name: banvic_network
    driver: bridge
