dags:
  persistence:
    enabled: false

  gitSync:
    enabled: true
    repo: https://github.com/mvsant/Banvic-Data-Warehouse
    branch: main
    ref: main
    depth: 1
    subPath: dags
    period: 10s

secret:
  - envName: POSTGRES_USER
    secretName: postgres-credentials
    secretKey: POSTGRES_USER
  - envName: POSTGRES_PASSWORD
    secretName: postgres-credentials
    secretKey: POSTGRES_PASSWORD
  - envName: POSTGRES_DB
    secretName: postgres-credentials
    secretKey: POSTGRES_DB

connections:
  - id: Banvic_Postgres
    type: postgres
    host: postgres-service.postgres.svc.cluster.local
    port: 5432
    login: $POSTGRES_USER
    password: $POSTGRES_PASSWORD
    schema: $POSTGRES_DB

