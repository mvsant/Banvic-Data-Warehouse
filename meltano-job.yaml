apiVersion: batch/v1
kind: Job
metadata:
  name: meltano-job
  namespace: meltano
spec:
  template:
    metadata:
      labels:
        app: meltano-pipeline
    spec:
      containers:
        - name: meltano-worker
          
          image: meltano-pipeline:v1
          
          imagePullPolicy: IfNotPresent
          
          command: ["meltano"]
          args: ["--environment=prod"]
          volumeMounts:
            
            - name: csv-ingestion-volume
              mountPath: /project/extract  
          env:
            - name: TARGET_POSTGRES_HOST
              value: "postgres-service.postgres.svc.cluster.local"
            - name: TARGET_POSTGRES_PORT
              value: "5432"
            - name: TARGET_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: TARGET_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: TARGET_POSTGRES_DBNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
      restartPolicy: OnFailure
      volumes:
        - name: csv-ingestion-volume
          persistentVolumeClaim:
            claimName: meltano-csv-pvc
