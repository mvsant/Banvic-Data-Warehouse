apiVersion: v1
kind: Pod
metadata:
  name: meltano-data-loader
  namespace: meltano
  labels:
    app: meltano-data-loader
spec:
  volumes:
    - name: meltano-data-volume
      persistentVolumeClaim:
        claimName: meltano-data-pvc
  containers:
    - name: data-loader
      image: busybox
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: meltano-data-volume
          mountPath: /project/data
  restartPolicy: Never
