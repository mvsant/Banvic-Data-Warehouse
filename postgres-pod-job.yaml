apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: banvic-database-postgres-pvc    
  namespace: postgres                    
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: banvic-database-postgres-alpine-pod 
  namespace: postgres                        
  labels:
    app: postgres
    release: banvic-database                 
spec:
  containers:
    - name: postgres
      image: postgres:16-alpine
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 5432
          name: dbport
      envFrom:
        - secretRef:
            name: postgres-credentials
  volumes:
    - name: postgres-data-volume
      persistentVolumeClaim:
        claimName: banvic-database-postgres-pvc 