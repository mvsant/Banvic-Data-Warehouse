default_environment: prod
project_id: 01a123c3-2974-7262-b81c-cc39c29fe2e6
environments:
- name: dev
- name: staging
- name: prod

plugins:
  extractors:
  - name: tap-csv
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-csv.git
    config:
      files:
      - entity: agencias
        path: /project/extract/agencias.csv
        keys: [cod_agencia]
        dialect:
          delimiter: ','
      - entity: colaboradores
        path: /project/extract/colaboradores.csv
        keys: [cod_colaborador]
        dialect:
          delimiter: ','
      - entity: colaborador_agencia
        path: /project/extract/colaborador_agencia.csv
        keys: [cod_colaborador, cod_agencia]
        dialect:
          delimiter: ','
      - entity: clientes
        path: /project/extract/clientes.csv
        keys: [cod_cliente]
        dialect:
          delimiter: ','
      - entity: contas
        path: /project/extract/contas.csv
        keys: [num_conta]
        dialect:
          delimiter: ','
      - entity: propostas_credito
        path: /project/extract/propostas_credito.csv
        keys: [cod_proposta, cod_cliente, cod_colaborador]
        dialect:
          delimiter: ','
      - entity: transacoes
        path: /project/extract/transacoes.csv
        keys: [cod_transacao, num_conta]
        dialect:
          delimiter: ','
  loaders:
  - name: target-postgres
    variant: meltanolabs
    pip_url: meltanolabs-target-postgres
    config:
      dialect+driver: postgresql+psycopg
      host: ${TARGET_POSTGRES_HOST}
      port: ${TARGET_POSTGRES_PORT}
      user: ${TARGET_POSTGRES_USER}
      password: ${TARGET_POSTGRES_PASSWORD}
      database: ${TARGET_POSTGRES_DBNAME}
      default_target_schema: public
