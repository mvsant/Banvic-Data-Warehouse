default_environment: dev
project_id: 01a0fbc9-4450-79cb-9e21-8a556c616243
environments:
- name: dev
- name: staging
- name: prod
plugins:
  extractors:
  - name: tap-csv
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-csv.git
    config:
      files:
      - entity: agencias
        path: ${MELTANO_PROJECT_ROOT}/extract/agencias.csv
        keys: [cod_agencia]
        dialect:
          delimiter: ','
      - entity: colaboradores
        path: ${MELTANO_PROJECT_ROOT}/extract/colaboradores.csv
        keys: [cod_colaborador]
        dialect:
          delimiter: ','

  loaders:
  - name: target-postgres
    variant: meltanolabs
    pip_url: meltanolabs-target-postgres
    config:
      dialect+driver: postgresql+psycopg
      host: banvic-data-postgres
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB}
      default_target_schema: public

